version: '3.8'

services:
  radiscribe-ai:
    build: .
    container_name: radiscribe_ai_engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models # Mount models directory
      - ./storage_bucket:/app/storage_bucket # Persistent storage for images
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
